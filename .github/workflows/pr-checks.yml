name: PR Checks

on:
  pull_request:
    branches:
      - pre-dev

jobs:
  lint-and-typecheck:
    name: Lint, Type Check & Compile
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff==0.15.15 pyright==1.1.410

      - name: Run ruff (lint)
        run: ruff check .

      - name: Run ruff (format check)
        run: ruff format --check .

      - name: Run pyright (type check)
        run: pyright .

      - name: Run py_compile (syntax check)
        run: |
          python -m compileall -q \
            -x '(^|/)(venv|\.venv|env|\.git|migrations|node_modules)(/|$)' \
            .
